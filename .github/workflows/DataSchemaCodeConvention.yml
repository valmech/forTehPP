name: SQL Linter
on:
  push:
    branches: [laboratory-work-4, main]
jobs:
  SQLLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code in Repository
        uses: "actions/checkout@v3"
      - name: Start SQL Linter
        run: |
          pip install sqlfluff
          sqlfluff lint $GITHUB_WORKSPACE/3-Software\ Construction/3.1-GitHubActions/DataSchema.sql --dialect oracle
