name: Code Linter

on:
  push:
    branches: [laboratory-work-4, main]

jobs:
  CodeLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Run Linter
        run: |
          pip install flake8
          flake8 .github/workflows/ProgramCode.py
