name: SQL Linter

on:
  push:
    branches: [laboratory-work-4, main]

jobs:
  SQLLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Start SQL Linter
        run: |
          pip install sqlfluff
          sqlfluff lint $GITHUB_WORKSPACE/.github/workflows/DataSchema.sql --dialect oracle
