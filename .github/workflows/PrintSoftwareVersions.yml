name: Print Software Versions
on:
  push:
    branches: [laboratory-work-4, main]
jobs:
  PrintDataProcessingVersion:
    runs-on: ubuntu-latest
    steps:
      - name: Print Python Version
        run: python --version
      - name: Print Node Version
        run: node --version
  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: [PrintDataProcessingVersion]
    steps:
      - name: Print PostgreSQL Version
        run: psql --version
      - name: Print MongoDB Version
        run: mongod --version
